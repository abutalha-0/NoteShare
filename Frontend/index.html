<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e7edf0">
  <meta name="description" content="Find and share useful course notes with your classmates.">
  <title>Fieldnotes — Notes from your classmates</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script src="theme.js"></script>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="profile.css?v=2">
</head>
<body>
  <div class="app-shell">
    <header class="masthead">
      <button class="brand" type="button" data-view="explore" aria-label="Fieldnotes home"><span class="brand-mark">f<span>✳</span></span><span class="brand-name">fieldnotes</span></button>
      <span class="masthead-center">MIT / COMPUTER SCIENCE & AI</span>
      <div class="top-actions"><button class="upload-trigger" type="button" data-modal="upload"><span aria-hidden="true">＋</span> Share note</button><button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark mode" aria-pressed="false" title="Switch to dark mode"><svg class="theme-icon theme-icon--moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 15.8A8.8 8.8 0 0 1 8.2 3.8 8.9 8.9 0 1 0 20.2 15.8Z"/></svg><svg class="theme-icon theme-icon--sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button><button class="top-notifications" type="button" data-view="notifications" aria-label="Notifications, 4 new"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M10 28h20l-3-4V17c0-5-3-9-7-9s-7 4-7 9v7zM17 32c1 2 5 2 6 0M20 5v3"/></svg><i aria-hidden="true"></i></button><button class="avatar" type="button" data-view="user-profile" aria-label="Open profile">AR</button></div>
    </header>
    <div class="workspace">
      <aside class="sidebar" aria-label="Main navigation">
        <div class="sidebar-caption">YOUR DESK</div>
        <nav class="main-nav">
          <button class="nav-item is-active" data-view="explore" type="button" aria-label="Explore notes"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M6 10h12l4 4h12v19H6zM6 14h16M11 20h18M11 25h14"/></svg><span>Explore notes</span></button>
          <button class="nav-item" data-view="discussions" type="button" aria-label="Discussions"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M5 8h24v18H17l-7 6v-6H5zM15 14h19v16h-7l-5 5v-5"/><path d="M11 15h10m-10 5h7"/></svg><span>Discussions</span></button>
          <button class="nav-item" data-view="saved" type="button" aria-label="Saved notes"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M9 5h22v30l-11-8-11 8zM14 11h12m-12 6h8"/></svg><span>Saved notes</span></button>
          <button class="nav-item" data-view="notifications" type="button" aria-label="Notifications, 4 new"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M10 28h20l-3-4V17c0-5-3-9-7-9s-7 4-7 9v7zM17 32c1 2 5 2 6 0M20 5v3"/></svg><span>Notifications</span><em>4</em></button>
          <button class="nav-item" data-view="user-profile" type="button" aria-label="Profile"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M8 34v-3c0-6 5-10 12-10s12 4 12 10v3H8zM20 18a6 6 0 1 0 0-12 6 6 0 0 0 0 12zM31 6v7m-3.5-3.5h7"/></svg><span>Profile</span></button>
          <button class="nav-item review-link" data-view="moderation" type="button" aria-label="Review queue"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 5 33 10v11c0 8-6 13-13 15C13 34 7 29 7 21V10zM20 13v11m0 5v1"/></svg><span>Review queue</span><em id="queueCount">1</em></button>
        </nav>
        <div class="sidebar-bottom"><p>LOCAL UI CONCEPT<br>Saved in this browser</p></div>
      </aside>
      <div class="paper-stage"><div class="paper-window"><div class="window-bar"><span><span aria-hidden="true">✳</span> STUDY LIBRARY</span><span>MIT / CS</span></div><main id="mainContent" tabindex="-1"></main></div></div>
    </div>
  </div>
  <div class="modal-layer" id="modalLayer" hidden><div class="modal-backdrop" data-close-modal></div><div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><button class="modal-close" type="button" data-close-modal aria-label="Close dialog">×</button><div id="modalContent"></div></div></div>
  <dialog class="note-reader" id="noteReader" aria-labelledby="readerTitle"></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js?v=2" defer></script>
</body>
</html>
